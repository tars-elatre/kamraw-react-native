name: Deploy verified demo
on:
  workflow_run:
    workflows: [Verify Kamraw]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  id-token: write
concurrency:
  group: kamraw-demo-deployment
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      AWS_REGION: ap-south-1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Load deployed resource references
        run: |
          test -f infra/deployment.json
          echo "ROLE_ARN=$(jq -r .deployRoleArn infra/deployment.json)" >> "$GITHUB_ENV"
          echo "ECR_URI=$(jq -r .repositoryUri infra/deployment.json)" >> "$GITHUB_ENV"
          echo "INSTANCE_ID=$(jq -r .instanceId infra/deployment.json)" >> "$GITHUB_ENV"
          echo "ARTIFACT_BUCKET=$(jq -r .artifactBucket infra/deployment.json)" >> "$GITHUB_ENV"
          echo "PUBLIC_URL=$(jq -r .url infra/deployment.json)" >> "$GITHUB_ENV"
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Check for an existing immutable release
        id: image
        run: |
          COUNT=$(aws ecr batch-get-image --repository-name "${ECR_URI##*/}" --image-ids imageTag="$RELEASE_SHA" --query 'length(images)' --output text)
          if [ "$COUNT" = 1 ]; then echo 'exists=true' >> "$GITHUB_OUTPUT"; else echo 'exists=false' >> "$GITHUB_OUTPUT"; fi
      - uses: docker/setup-buildx-action@v3
      - name: Build and publish immutable image
        if: steps.image.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: ${{ env.ECR_URI }}:${{ env.RELEASE_SHA }}
          build-args: |
            PUBLIC_URL=${{ env.PUBLIC_URL }}
            RELEASE_SHA=${{ env.RELEASE_SHA }}
          cache-from: type=gha,scope=deploy-arm64
          cache-to: type=gha,scope=deploy-arm64,mode=max
      - name: Migrate, deploy and verify HTTPS
        env:
          GITHUB_SHA: ${{ env.RELEASE_SHA }}
        run: bash scripts/deploy-ci.sh
