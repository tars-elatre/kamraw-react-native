name: Verify Kamraw
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kamraw
          POSTGRES_PASSWORD: ci-disposable-only
          POSTGRES_DB: kamraw_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U kamraw" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://kamraw:ci-disposable-only@localhost:5432/kamraw_test
      EXPO_PUBLIC_APP_MODE: demo
      EXPO_PUBLIC_API_URL: https://demo.kamraw.com
      EXPO_PUBLIC_WEB_URL: https://demo.kamraw.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - name: Bundle Android, iOS and web
        working-directory: apps/mobile
        run: npx expo export --platform all
      - name: Validate infrastructure
        run: |
          pip install cfn-lint==1.46.0
          cfn-lint -t infra/demo.yaml -r ap-south-1
      - uses: docker/setup-buildx-action@v3
      - name: Build container
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
