services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kamraw
      POSTGRES_PASSWORD: local-demo-only
      POSTGRES_DB: kamraw
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["database:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kamraw"]
      interval: 5s
      retries: 10
  api:
    build:
      context: .
      args:
        PUBLIC_URL: http://localhost:4000
    environment: &env
      APP_MODE: demo
      DATABASE_URL: postgresql://kamraw:local-demo-only@db:5432/kamraw
      WEB_ORIGIN: http://localhost:4000
      PUBLIC_API_URL: http://localhost:4000
    command: ["sh", "-c", "node apps/api/dist/db/migrate.js && node apps/api/dist/db/seed.js && node apps/api/dist/server.js"]
    ports: ["127.0.0.1:4000:4000"]
    volumes: ["media:/data/media"]
    depends_on:
      db: {condition: service_healthy}
  worker:
    build: .
    environment: *env
    command: ["node", "apps/api/dist/workers/run.js"]
    depends_on:
      api: {condition: service_healthy}
volumes:
  database:
  media:
